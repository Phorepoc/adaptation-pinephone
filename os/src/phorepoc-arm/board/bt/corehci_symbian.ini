; corehci_symbian.ini -- OURS (PinePhone, Bluetooth rung R2): which HCTL and initialisor plug-ins the Symbian CoreHCI
; loads (z:\private\101f7989\bluetooth\). Shape of the 2010 corehci_symbian.ini (oss.FCL.sf.os.bt/bthci/
; hci2implementations/corehcis/symbian/group); the UIDs are the implementation_uid fields of the plug-ins' .rss.
[Plugins]
; OURS hctl_h5 (src/hctl_h5): H5 three-wire UART transport to the RTL8723CS on UART1
hctl_uid= 0xE7015731
; OURS initialisor_rtl (src/initialisor_rtl, R3): the firmware patch download + the baud switch. The stock no-op
; Symbian initialisor 0x1027407D runs the stack on the chip's ROM firmware instead (R2, boot 188: it works)
initialisation_uid= 0xE7015733
