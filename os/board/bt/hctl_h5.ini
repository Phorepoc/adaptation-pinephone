; hctl_h5.ini -- OURS (PinePhone, Bluetooth rung R2): the H5 HCTL's port (z:\private\101f7989\bluetooth\).
; [hctl] port / baud_rate / pwr_ctrl_mode are read by the 2010 CHCTLUartBase; crc is ours.
[hctl]
; RBusDevComm unit 1 = "Comm.A64" UART1 (src/phorepoc-arm/a64/bt/a64uart.cpp): the RTL8723CS
port= 1
; the chip always starts at 115200 8E1; the initialisor switches to 1.5 Mbaud after the firmware download (R3)
baud_rate= 115200
; 0 = no power-off detection (1 = "CTS low for 10 s means off" would misfire while the chip is held in reset)
pwr_ctrl_mode= 0
; 1 = put a data integrity check (CRC) on our reliable frames when the controller agrees; 0 = never (what Linux
; does, and what the chip is known to work with)
crc= 0
