# release.yml -- the PinePhone image: a whole SD-card image (.img.xz) to write with balenaEtcher, built by the pdk's
# reusable workflow from the commits board.lock pins. Every push to main builds the image. When the commits since the
# last release ask for one (Conventional Commits: feat = minor, fix/perf = patch, breaking = major; the pdk's
# tools/ci/next_version.sh), the image is released under that version. Changes are tested on the phone before they are
# pushed.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".github/readme/**"]   # documentation alone builds no image
  workflow_dispatch:

# one release run at a time, in push order: each computes its version from the tags the previous one made
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The pdk's release scripts, at the commit board.lock pins
        run: |
          pdk=$(sed 's/#.*//' board.lock | awk '$1 == "pdk" { print $2 }')
          echo "$pdk" | grep -q -x -E '[0-9a-f]{40}' || { echo "::error::board.lock: no full commit hash for pdk"; exit 1; }
          for f in next_version.sh commit_lint.sh; do
            curl -fsSL -o "/tmp/$f" "https://raw.githubusercontent.com/${{ github.repository_owner }}/pdk/$pdk/tools/ci/$f"
          done
      - name: Conventional Commit subjects
        if: github.event_name == 'push'
        run: sh /tmp/commit_lint.sh "${{ github.event.before }}" "${{ github.sha }}"
      - name: Next version
        id: v
        run: |
          v=$(sh /tmp/next_version.sh)
          echo "next version: ${v:-none (nothing to release)}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    uses: Phorepoc/pdk/.github/workflows/board-image.yml@main
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
      packages: write   # (the split build hands its tree between jobs as a run image)

  # the release itself is made here, in this repository's own workflow (see the pdk's board-image.yml)
  publish:
    needs: [version, image]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release view "$VERSION" -R "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create "$VERSION" -R "${{ github.repository }}" --target "${{ github.sha }}" --title "$VERSION" \
              --notes-file notes.md
          gh release upload "$VERSION" out/* -R "${{ github.repository }}" --clobber
          # (a draft left by an earlier run becomes this release: this commit, these files, published)
          gh release edit "$VERSION" -R "${{ github.repository }}" --target "${{ github.sha }}" --notes-file notes.md --draft=false
